name: Engine security baseline

# Check daily. Qt and Chromium releases do not change this repository, so
# nothing here notices one until this asks, and the response window starts when
# the issue opens: a check that sleeps for six days spends those days of the
# window on not having looked. The run edits one open issue rather than
# commenting, so a daily cadence adds no noise. Updating the baseline still
# requires release-note review and a qualified build.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the approved baseline against upstream
        # Preserve the check's exit status through the `tee` pipeline.
        shell: bash
        run: |
          echo '### Engine security baseline' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          scripts/check_security_baseline.py --report baseline.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Report the drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check_security_baseline.py --issue-from baseline.json
