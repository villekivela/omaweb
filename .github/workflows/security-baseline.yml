name: Engine security baseline

# `security/baseline.json` names the QtWebEngine a supported Omaweb build runs
# on and the Chromium release whose security fixes it carries. Both go stale on
# someone else's schedule, and nothing in this repository changes when they do.
# This looks weekly and leaves one issue behind. It never raises the baseline:
# reading a Qt release's security notes and qualifying a build is a human's
# work, and the seven-day response in SECURITY.md starts from this issue.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the approved baseline against upstream
        # `tee` would otherwise report the step's status, so a check that gave
        # up on a fetch would pass as green.
        shell: bash
        run: |
          echo '### Engine security baseline' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          scripts/check_security_baseline.py --report baseline.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Report the drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check_security_baseline.py --issue-from baseline.json
