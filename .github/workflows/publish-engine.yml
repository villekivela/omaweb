name: Publish the engine

# The engine is Omaweb's own package on its own release schedule (ADR 0049), so
# it reaches the pacman repository by itself rather than with a browser release.
# Started by hand, because whether a built engine is worth serving to readers is
# a judgement about what the Qt release carries and what the gate said.
#
# What it takes is an unsigned package built by `package-locally.sh` in the patch
# repository, attached to a release here. That repository owns the PKGBUILD and
# the notices; this one owns the signing key and the pacman repository, and this
# workflow is the join. Nothing crosses between them but one file.
#
# It is also how a browser release reaches the repository when the Release
# workflow's own `publish-repo` failed after the release was published. A pushed
# tag is never moved, and re-running that job runs the tag's copy of the
# workflow, broken step included, so the packages are taken off the release and
# published from here instead. The tag names which package is expected:
# `engine-*` is the engine and `v*` is the browser.
on:
  workflow_dispatch:
    inputs:
      tag:
        description:
          "The release holding the packages: engine-6.11.2-2 for the engine, v0.7.1 for the browser"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install toolchain
        # `pacman` carries `repo-add`, `libarchive` carries `bsdtar`, and both
        # are what `publish_repo.sh` asks for.
        run: pacman -Syu --noconfirm git gnupg github-cli libarchive

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Take the packages off the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.pkg.tar.*' --dir artifacts
          # What the build said it built, if it said. Absent on an engine built
          # before the build wrote one, and then the baseline is left alone.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'engine.json' --dir artifacts || true
          # A signature already on the release is not this job's to trust: it
          # signs what it publishes itself, so an attached `.sig` is dropped
          # rather than served.
          rm -f artifacts/*.sig
          found=$(find artifacts -maxdepth 1 -name '*.pkg.tar.*' | wc -l)
          if [ "$found" -eq 0 ]; then
            echo "::error::$TAG carries no package" >&2
            exit 1
          fi
          echo "took $found package(s) off $TAG"

      - name: Refuse any package the tag does not name
        # This workflow publishes to the repository readers install from, and
        # its input is whatever someone attached to a release. So what it will
        # serve is named here rather than inferred: a package of another name
        # than its tag's, or one whose name and contents disagree, stops the run.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            engine-*) expected=omaweb-qtwebengine ;;
            v[0-9]*) expected=omaweb ;;
            *)
              echo "::error::$TAG is neither an engine-* nor a v* release" >&2
              exit 1
              ;;
          esac
          for package in artifacts/*.pkg.tar.*; do
            pkgname=$(bsdtar -xOf "$package" .PKGINFO | sed -n 's/^pkgname = //p' | head -n 1)
            if [ "$pkgname" != "$expected" ]; then
              echo "::error::$(basename "$package") is $pkgname, not $expected" >&2
              exit 1
            fi
            # `publish_repo.sh` files a package by the architecture in its name,
            # so a name disagreeing with the build inside it would serve an
            # aarch64 engine to an x86_64 reader.
            named=$(basename "$package")
            named=${named##*-}
            named=${named%%.pkg.tar.*}
            built=$(bsdtar -xOf "$package" .PKGINFO | sed -n 's/^arch = //p' | head -n 1)
            if [ "$named" != "$built" ]; then
              echo "::error::$(basename "$package") is named $named and was built for $built" >&2
              exit 1
            fi
            echo "$(basename "$package") is $expected, for $built"
          done

      # The same key and the same unlocking as a browser release, because it is
      # the same repository being signed. Without the secret there is nothing to
      # do and the job says so rather than publishing something unsigned, which
      # a reader's `SigLevel = Required` would refuse anyway.
      - name: Take up the signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.PACMAN_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.PACMAN_SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::no PACMAN_SIGNING_KEY secret, so nothing can be published" >&2
            exit 1
          fi
          export GNUPGHOME=/tmp/gnupg
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          if [ -n "$PASSPHRASE" ]; then
            printf '%s' "$PASSPHRASE" > "$GNUPGHOME/passphrase"
            chmod 600 "$GNUPGHOME/passphrase"
            # `repo-add` signs the database with a plain `gpg --detach-sign`,
            # passing neither `--batch` nor a passphrase, so whether that
            # signature can be made at all depends on gpg reading the file on
            # its own.
            {
              echo "batch"
              echo "pinentry-mode loopback"
              echo "passphrase-file $GNUPGHOME/passphrase"
            } > "$GNUPGHOME/gpg.conf"
            echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          fi
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          if [ -z "$fingerprint" ]; then
            echo "::error::PACMAN_SIGNING_KEY carried no secret key" >&2
            exit 1
          fi
          # The key the pages tell a reader to check, held against the key this
          # is about to sign with. A secret that had been rotated without the
          # pages following would otherwise publish a repository nobody can
          # install from.
          published=$(gpg --show-keys --with-colons security/repo-signing-key.asc \
            | awk -F: '/^fpr:/ { print $10; exit }')
          if [ "$fingerprint" != "$published" ]; then
            echo "::error::the secret key is $fingerprint and the pages publish $published" >&2
            exit 1
          fi
          # Its own key, so that verifying what it just signed is not a warning.
          echo "$fingerprint:6:" | gpg --batch --import-ownertrust
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # The repository as it stands, so `repo-add` updates what is published
      # rather than starting from nothing and dropping the browser package that
      # is already there.
      - name: Publish the packages to the repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          for package in artifacts/*.pkg.tar.*; do
            # The architecture is in the package's name, which is where
            # `publish_repo.sh` reads it from too, and it decides which
            # repository the package belongs to.
            arch=$(basename "$package")
            arch=${arch##*-}
            arch=${arch%%.pkg.tar.*}

            scripts/fetch_repo.sh --tag "repo-$arch" --dir "/tmp/repo/$arch"
            scripts/publish_repo.sh --package "$package" --repo-dir /tmp/repo \
              --key "${{ steps.key.outputs.fingerprint }}"
            scripts/serve_repo.sh --tag "repo-$arch" --dir "/tmp/repo/$arch" \
              --title "Package repository ($arch)"

            {
              echo "### Published to the pacman repository"
              echo
              echo "\`$(basename "$package")\` from \`$TAG\` is served for \`$arch\`."
              echo
              echo "A reader takes it with an ordinary \`pacman -Syu\`."
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # The baseline has to name the engine the repository now serves, or
      # Settings marks every reader's build an unsupported preview. A pull
      # request rather than a commit, because raising it means the release notes
      # were read and a build was qualified, and neither is something this job
      # can know. What is removed is the typing, not the judgement.
      #
      # Last, after the engine is already served. A pull request that could not
      # be opened is worth a red run, and it is not worth holding the engine
      # back over: readers get the engine either way, and the baseline is a
      # claim about it that a person has to finish anyway.
      - name: Offer the baseline this engine needs
        if: hashFiles('artifacts/engine.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/offer_engine_baseline.py --engine artifacts/engine.json \
            --tag "${{ inputs.tag }}" --base "${{ github.ref_name }}"
