name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check commit messages
        run: scripts/check_commit_messages.sh

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake ninja ccache qtwebengine
      - name: Locate Qt
        run: echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"
      - name: Bootstrap content blocker
        run: scripts/bootstrap_content_blocker.sh
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Publish content-blocking compatibility
        run: |
          echo '### Content-blocking compatibility' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/content-blocking-compatibility.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure release resources
        run: cmake --preset release
      - name: Build release
        run: cmake --build --preset release
      - name: Verify embedded QML
        run: ctest --preset release -R '^(tanto-shared-qml-boundary|tanto-qml-load)$'

  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm git cmake ninja clang ccache qt6-base qt6-declarative qt6-webengine
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap content blocker
        run: scripts/bootstrap_content_blocker.sh
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Publish content-blocking compatibility
        run: |
          echo '### Content-blocking compatibility' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/content-blocking-compatibility.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
