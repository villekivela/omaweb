name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install formatters
        run: pacman -Syu --noconfirm git clang qt6-declarative nodejs npm python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install formatting dependencies
        run: npm ci
      - name: Check changed files
        env:
          STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$STYLE_BASE" ] && git rev-parse --verify "$STYLE_BASE^{commit}" >/dev/null 2>&1; then
            scripts/check_changed.sh "$STYLE_BASE"
          else
            scripts/check_format.sh --all
            scripts/check_qml.sh --all
            git diff --check
          fi

      # The policy is enforced at the reader's end, so a violation deploys
      # green and breaks the page for everyone. Checked here instead.
      - name: Check the website against its own policy
        run: scripts/check_website_csp.py

      # The README and the website both tell a reader how to add the [omaweb]
      # repository, and a reader follows whichever they opened. A fingerprint
      # that is current in one and stale in the other fails at their machine
      # with a signature error, which is the worst place to find out.
      - name: Check the repository instructions agree
        run: scripts/check_repository_instructions.py

      # Two branches open at once, neither seeing the other's number, is how
      # two decisions came to be numbered 0038 (#274). Nothing either author
      # could have checked would have caught it: the number was free when each
      # wrote their file, and the collision exists only in the merged tree.
      - name: Check no two decisions hold one number
        run: scripts/check_adr_numbers.py

      # The build step that writes the release notes into the site. Vercel runs
      # it on deploy, where a failure is a page nobody has looked at yet, so
      # the rendering it does is held here. `node --test` is the whole harness
      # and this job already has Node for the formatters. The website's own
      # `npm ci` is the Markdown parser the renderer imports, installed the
      # same way the deploy installs it.
      - name: Install the website build's dependency
        run: npm ci --prefix website
      - name: Test the website build
        run: node --test website/build/

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check commit messages
        run: scripts/check_commit_messages.sh

  # The four Arch jobs below cost between two and ten minutes each, and a change
  # confined to prose or the website cannot break a build, so they are asked
  # rather than assumed. `scripts/source_changed.sh` is the answer and the
  # reasoning both: it prints the files it decided on, so a pull request whose
  # build did not run says why in this job's log.
  #
  # A gate job rather than a `paths-ignore:` on the workflow. `arch-linux` is a
  # required check, and a workflow skipped by path filtering leaves its required
  # checks pending forever; path filtering would also skip `style`, which has to
  # run on prose.
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.check.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the build has anything to do
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No base to compare against: a manual run, or a branch's first push.
          # Build, because the alternative is deciding from nothing.
          if [ -z "$BASE" ] || ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            echo "no base commit to compare against, so the build runs"
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if scripts/source_changed.sh "$BASE" "$HEAD"; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

  arch-linux:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install toolchain
        # `rust` carries cargo, which the content-blocker bootstrap needs. This
        # container ships nothing it is not told to.
        #
        # `cage`, `wtype` and `qt6-wayland` belong to the runtime budget below:
        # a compositor for the browser to map a window on, a key synthesiser
        # for a compositor that has no dispatcher of its own, and the Wayland
        # platform plugin the browser needs to talk to either. `dnsmasq` is the
        # page-load budget's DNS server, which the test names and their CNAME
        # chains resolve through.
        #
        # Cage rather than sway. Arch ships sway with `cap_sys_nice` file
        # capabilities, and execing a file with capabilities the container
        # cannot grant fails with EPERM before sway prints anything. Cage also
        # is the smaller thing to ask for: one program under one compositor,
        # which is exactly the shape of this step.
        #
        # `qt6-webengine` rather than the engine Omaweb ships (ADR 0049).
        # Nothing here tests an extension: the engine's own suite lives with the
        # patch series, and a Known extension is fetched at runtime rather than
        # built. What this job needs is an engine to render in, and the
        # distribution's is the one that installs in seconds. The release
        # workflow builds against Omaweb's, which is where the version the
        # binary is compiled for has to match the one it runs on.
        run:
          pacman -Syu --noconfirm git cmake ninja clang ccache rust qt6-base qt6-declarative
          qt6-webengine qt6-wayland libsecret libsodium cage wtype dnsmasq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Take the build off root
        # A container runs as root, and Chromium refuses to start as root
        # unless its sandbox is turned off. Omaweb does not build or test with
        # the sandbox off (ADR 0013), and the rule in docs/development.md is to
        # fix the host rather than pass the flag — so the host gets a user.
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Bootstrap content blocker
        run: su builder -c 'scripts/bootstrap_content_blocker.sh'
      - name: Configure
        run: su builder -c 'cmake --preset ci'
      - name: Build
        run: su builder -c 'cmake --build --preset ci'
      - name: Test
        run: su builder -c 'ctest --preset ci'
      # What the browser costs at runtime, against the ceilings in
      # `performance/budget.json`. It measures the build this job has already
      # made, so it costs a few minutes rather than a second build.
      #
      # Only what is stable without hardware: process start to the window
      # mapping, the proportional set size of the process tree at rest and
      # with Spaces open, whether a frozen Space's pages are still running,
      # and what Content blocking adds to a page load. There is no GPU and no desktop here, so a paint timing
      # measured in this container would be a software rasteriser's rather
      # than a reader's, and those stay on the machines that have both.
      #
      # Cage runs the script rather than the other way round: started as a
      # sibling it would have to be asked which socket it opened, and started
      # as its one program it hands the script `WAYLAND_DISPLAY` and this job
      # the script's own output. The status is carried out through a file
      # because what the job has to exit with is the script's answer, not the
      # compositor's.
      #
      # `--require-dns` fails the page-load measurement where a developer's
      # machine would skip it, so the budget cannot quietly stop measuring
      # here.
      - name: Measure startup, memory and page loads against the budget
        run: |
          rm -f /tmp/budget.status
          printf 'cd %s\n' "$GITHUB_WORKSPACE" > /tmp/measure.sh
          cat >> /tmp/measure.sh <<'SCRIPT'
          scripts/benchmark_runtime.py --browser build/ci/omaweb --require-dns
          echo $? > /tmp/budget.status
          SCRIPT
          chmod 0755 /tmp/measure.sh
          su builder -c '
            set -eu
            export XDG_RUNTIME_DIR=/tmp/runtime-builder
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            # wlroots with no card to open: the headless backend renders into
            # memory through pixman and offers one output, which is a Wayland
            # session for the browser to be measured on rather than a desktop.
            # Cage says it cannot start an XWayland it has no binary for and
            # carries on; nothing measured here is an X11 client.
            export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
            cage -- /tmp/measure.sh
          '
          # No status file means the compositor never ran the script, which is
          # a failed job rather than a budget nobody measured.
          exit "$(cat /tmp/budget.status 2>/dev/null || echo 1)"

      - name: Publish content-blocking compatibility
        run: |
          echo '### Content-blocking compatibility' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/content-blocking-compatibility.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure release resources
        run: su builder -c 'cmake --preset release'
      - name: Build release
        run: su builder -c 'cmake --build --preset release'
      - name: Verify compiled QML
        # The release preset compiles QML into the binary instead of loading it
        # from source, so these guard the packaged form. All are
        # platform-neutral: two are CMake script checks, one of them reading
        # the build graph for the compile steps, and the third loads the
        # compiled QML offscreen.
        run:
          su builder -c "ctest --preset release -R
          '^(omaweb-shared-qml-boundary|omaweb-qml-build-graph|omaweb-qml-load)$'"

  # The same tree under the other compiler. `arch-linux` pins clang, and no
  # preset names a compiler, so the gate `docs/agents/code-style.md` asks for
  # builds with whatever the host has — which on Arch is GCC. Without this,
  # each compiler's own warnings are only ever found by whoever happens to run
  # that one, which is how a `-Werror` build reached main having passed CI.
  #
  # Build and test only. The release resources and the compatibility summary
  # belong to one job rather than both, because a second copy of them reports
  # nothing the first does not.
  arch-linux-gcc:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install toolchain
        run:
          pacman -Syu --noconfirm git cmake ninja gcc ccache rust qt6-base qt6-declarative
          qt6-webengine libsecret libsodium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Take the build off root
        # Same reason as `arch-linux`: Chromium refuses to start as root with
        # its sandbox on, and Omaweb does not turn it off (ADR 0013).
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Bootstrap content blocker
        run: su builder -c 'scripts/bootstrap_content_blocker.sh'
      - name: Configure
        run: su builder -c 'cmake --preset ci'
      - name: Build
        run: su builder -c 'cmake --build --preset ci'
      - name: Test
        run: su builder -c 'ctest --preset ci'

  # The publishing path a release takes to reach `pacman -Syu`. It is the one
  # part of a release that has no dry run of its own: the first time it matters
  # is a tag, and by then the release is already out. `check_repo_publish.sh`
  # runs everything but the upload against a throwaway key and a scratch
  # directory, so what a tag day carries is an upload rather than a first run.
  #
  # Root, because pacman refuses to sync as anyone else even into a scratch
  # root, and this installs from the repository it just published to prove a
  # client accepts it.
  pacman-repo:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 10
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm git gnupg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to a scratch repository and install from it
        run: scripts/check_repo_publish.sh

  arch-package:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install toolchain
        run:
          pacman -Syu --noconfirm git cmake ninja clang rust qt6-base qt6-declarative qt6-webengine
          qt6-wayland hicolor-icon-theme xdg-utils libsecret libsodium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package takes its version from the nearest release tag, so a
          # shallow checkout with no tags would build one that names nothing.
          fetch-depth: 0
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build, install, upgrade and remove the package
        # The container is the disposable machine this needs: it installs the
        # package for real and checks that removing it leaves nothing behind.
        run: scripts/check_package.sh
