# [DEBUG-600] Repeats the page-load step on CI's runner with the fix for #600: the container
# started with arch-linux's --shm-size, and the step's own plan and spares. One job keeps Docker's
# default /dev/shm, where the step must refuse to measure. Diagnostics, removed before it merges.
name: Diagnose 600

on:
  push:
    branches: [fix/600-find-what-cancels-answered-images]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageload:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: ${{ matrix.options }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed]
        shard: [1, 2, 3, 4, 5, 6]
        options: [--shm-size=2g]
        include:
          - variant: default
            shard: 1
            options: ""
    env:
      CC: clang
      CXX: clang++
      SHARD: ${{ matrix.variant }}-${{ matrix.shard }}
      REPETITIONS: ${{ matrix.variant == 'fixed' && 6 || 1 }}
    steps:
      - name: Install toolchain
        run:
          pacman -Syu --noconfirm git cmake ninja clang ccache rust qt6-base qt6-declarative
          qt6-shadertools qt6-tools qt6-wayland libsecret libsodium cage wtype dnsmasq
          gnu-free-fonts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Omaweb's engine
        run: |
          scripts/trust_omaweb_repository.sh
          pacman -Syu --noconfirm omaweb-qtwebengine
      - name: Take the build off root
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Bootstrap content blocker
        run: su builder -c 'scripts/bootstrap_content_blocker.sh'
      - name: Configure
        run:
          su builder -c 'cmake --preset ci -DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=/usr/lib/omaweb
          -DOMAWEB_KNOWN_EXTENSIONS=ON'
      - name: Build
        run: su builder -c 'cmake --build --preset ci'
      - name: Repeat the page loads
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo; free -m
          df -h /dev/shm
          mkdir -p /tmp/diag
          chown builder /tmp/diag
          cat > /tmp/peak.py <<'PEAK'
          import os, sys, time
          peak = 0
          while os.path.exists(sys.argv[1]):
              stat = os.statvfs("/dev/shm")
              peak = max(peak, (stat.f_blocks - stat.f_bfree) * stat.f_frsize)
              time.sleep(0.001)
          stat = os.statvfs("/dev/shm")
          print(f"{peak // 1048576} of {stat.f_blocks * stat.f_frsize // 1048576} MiB")
          PEAK
          printf 'cd %s\n' "$GITHUB_WORKSPACE" > /tmp/measure.sh
          cat >> /tmp/measure.sh <<'SCRIPT'
          for i in $(seq "$REPETITIONS"); do
            out=/tmp/diag/run-$i
            mkdir -p "$out"
            touch /tmp/sampling
            python3 /tmp/peak.py /tmp/sampling > "$out/peak.txt" &
            sampler=$!
            scripts/benchmark_runtime.py pageload \
              --browser build/ci/omaweb-browser --require-dns > "$out/output.txt" 2>&1
            status=$?
            rm -f /tmp/sampling
            wait "$sampler"
            short=$(sed -n 's/.*repeated \([0-9]*\) of.*/\1/p' "$out/output.txt")
            failed=$(grep -c '^FAILED' "$out/output.txt")
            cases=$(grep -oE '^    load [0-9]+ \([a-z]+ hosts, blocking [a-z]+' "$out/output.txt" \
              | sed 's/.*(\([a-z]*\) hosts, blocking \([a-z]*\)/\1-\2/' | sort | uniq -c | tr -s ' \n' ' ')
            echo "=== $SHARD repetition $i exit $status cut short ${short:-0} failed $failed" \
              "peak /dev/shm $(cat "$out/peak.txt") cases:${cases}"
            grep -E '^FAILED' "$out/output.txt" || true
          done
          chmod -R a+rX /tmp/diag
          SCRIPT
          chmod 0755 /tmp/measure.sh
          scripts/benchmark_runtime.py --print-dns-zone > /tmp/pageload-zone.conf
          dnsmasq --conf-file=/tmp/pageload-zone.conf --pid-file=/tmp/dnsmasq.pid
          cp /etc/resolv.conf /tmp/resolv.conf.saved
          trap 'cat /tmp/resolv.conf.saved > /etc/resolv.conf; kill "$(cat /tmp/dnsmasq.pid)"' EXIT
          echo 'nameserver 127.0.0.1' > /etc/resolv.conf
          su builder -c "
            set -eu
            export XDG_RUNTIME_DIR=/tmp/runtime-builder SHARD=$SHARD REPETITIONS=$REPETITIONS
            mkdir -p \"\$XDG_RUNTIME_DIR\"
            chmod 700 \"\$XDG_RUNTIME_DIR\"
            export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
            cage -- /tmp/measure.sh
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pageload-diagnostics-${{ matrix.variant }}-${{ matrix.shard }}
          path: /tmp/diag/
          if-no-files-found: ignore
