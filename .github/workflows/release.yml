name: Release

# A release is cut by pushing a tag. The tag is the source of truth: CMake
# derives the version from it, so the tag and the binary cannot disagree.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A release carries the Arch package, the inventory of what is in it, and the
# notes. macOS bundles are development artifacts and are not attached
# (ADR 0029).

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  # Built in the same container CI checks the package in, so what a release
  # carries is what was already checked to install, upgrade and remove.
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install toolchain
        run:
          pacman -Syu --noconfirm git cmake ninja clang rust python qt6-base qt6-declarative
          qt6-webengine qt6-wayland hicolor-icon-theme xdg-utils libsecret libsodium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package takes its version from the nearest release tag, so the
          # tags have to be here for it to find the one being released.
          fetch-depth: 0
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the package
        # makepkg refuses to run as root, so the container's root builds as a
        # user it makes for the purpose. The source is this checkout at the tag
        # rather than a fresh clone, so the package is built from the commit the
        # release names.
        run: |
          useradd --create-home builder
          mkdir -p /tmp/build artifacts
          cp packaging/PKGBUILD /tmp/build/PKGBUILD
          cp packaging/omaweb-git.install /tmp/build/omaweb-git.install
          sed -i "s|^source=.*|source=(\"\$_pkgname::git+file://$GITHUB_WORKSPACE#tag=$GITHUB_REF_NAME\")|" \
            /tmp/build/PKGBUILD
          chown -R builder /tmp/build
          su builder -c 'cd /tmp/build && makepkg -f --noconfirm'
          # A container whose makepkg.conf enables `debug`, which Arch's own
          # base-devel does, produces a second package carrying the detached
          # symbols. That one is not what a reader installs, and attaching it
          # leaves the release offering two near-identically named files with
          # nothing to choose between them. `check_package.sh` skips it the
          # same way and says the same thing about why.
          find /tmp/build -maxdepth 1 -name '*.pkg.tar.*' ! -name '*-debug-*' \
            -exec cp {} artifacts/ \;
          # One package, or the release is wrong in a way nobody would notice
          # until they downloaded the wrong half of it.
          count=$(find artifacts -maxdepth 1 -name '*.pkg.tar.*' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one package to attach, found $count" >&2
            find artifacts -maxdepth 1 -name '*.pkg.tar.*' >&2
            exit 1
          fi

      - name: Generate the inventory
        run:
          scripts/generate_sbom.py --output "artifacts/omaweb-$GITHUB_REF_NAME-sbom.json" --version
          "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: artifacts/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes are generated from the range since the previous tag, so the
          # whole history and every tag has to be present.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main" >&2
            exit 1
          fi

      - name: Generate notes
        run: |
          scripts/release_notes.sh "${GITHUB_REF_NAME}" > notes.md
          {
            echo "## Generated from the commits"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The commit list above is accurate and written for the people who wrote
      # the commits. This rewrites it as what a reader gets from upgrading,
      # from the same range's commit bodies and the issues behind them.
      #
      # `ANTHROPIC_API_KEY` is the one piece of setup a human does once. A tag
      # push publishes with nothing in between, so every way this can fail ends
      # the same way: the generated notes publish and the job summary says the
      # rewrite did not happen. A plainer release beats a blocked one.
      - name: Rewrite the notes for a reader
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The rewrite reads the issues the commits reference, which is what
          # keeps it describing what was asked for rather than what a subject
          # line happens to say.
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/rewrite_release_notes.py "${GITHUB_REF_NAME}" \
              --generated notes.md --output rewritten.md; then
            mv rewritten.md notes.md
            heading="## Published"
          else
            echo "::warning::the notes were not rewritten, publishing the generated list"
            heading="## Published, unrewritten"
          fi
          {
            echo
            echo "$heading"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything below 1.0.0 is pre-release, as ADR 0028 records.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            v0.*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease} \
            artifacts/*

      # The website reads the releases at build time, so a tag only reaches the
      # page on the next deploy. Nothing else deploys on a tag: Vercel builds on
      # pushes to branches, and this ref is a tag. Without this, a release is
      # published and the site keeps showing the one before it until someone
      # happens to push a commit.
      #
      # `VERCEL_DEPLOY_HOOK_URL` is a Deploy Hook created once in the Vercel
      # project's Git settings. It is a URL that stands in for a credential, so
      # it is a secret. Until one exists the step says so and the release still
      # publishes: the site is behind, which is the same place it is today.
      - name: Deploy the website
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL secret: the website keeps the previous release" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The release is already published by the step above, so a deploy
          # that does not answer is a stale page rather than a failed release.
          # It warns and the job stays green, which is why the curl exit code
          # is captured instead of ending the step.
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --request POST "$HOOK") || status="no answer"
          echo "Vercel deploy hook answered ${status}" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            2*) ;;
            *) echo "::warning::the website deploy hook answered ${status}, so the site is behind" ;;
          esac
