name: Release

# A release is cut by pushing a tag. The tag is the source of truth: CMake
# derives the version from it, so the tag and the binary cannot disagree.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A release carries an Arch package for each architecture Omaweb is built for,
# the inventory of what is in them, and the notes. macOS bundles are development
# artifacts and are not attached (ADR 0029).

on:
  push:
    tags: ["v[0-9]*"]
  # A dry run: the packages are built and attached to the run, and nothing is
  # published. The `aarch64` package is built on a runner and a base image no
  # other workflow uses, so this is how that leg is exercised without a tag,
  # which would publish whatever it produced.
  workflow_dispatch:

permissions:
  contents: write
  # The notes rewrite reads the issues and pull requests the commits reference.
  # Naming any scope sets every other one to none, so these are not spare.
  issues: read
  pull-requests: read

jobs:
  # One package per architecture, each built natively. There is no official Arch
  # container for `arm64`, because Arch Linux ARM is a separate distribution from
  # Arch, and building under emulation runs far past any timeout this job could
  # be given. So `aarch64` is built on an Arm runner from a community image, and
  # ADR 0044 records what that costs and what it buys.
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      # One architecture failing is not a reason to stop learning whether the
      # other one built. Neither is published without the other: the release
      # waits on the whole matrix.
      fail-fast: false
      matrix:
        include:
          # Built in the same container CI checks the package in, so what a
          # release carries is what was already checked to install, upgrade and
          # remove.
          - arch: x86_64
            runner: ubuntu-latest
            container: archlinux:base-devel
            minutes: 30
            pacman-flags: ""
          # Pinned by digest, unlike the official image above, because this one
          # is a community rebuild of Arch Linux ARM rather than a distribution
          # image. The tag it was taken from is `base-devel-20260915`, which is
          # how a later one is found when this is refreshed. An Arm runner has
          # fewer cores than the x86_64 one, so the build gets longer.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:a7a04e07d5feb063229eb3796a96743a9a3c28a5facce749c4d0ebfbfddece14
            minutes: 60
            # pacman 7 downloads inside a Landlock sandbox, and on the Arm
            # runner applying it fails with `Operation not permitted`, so a
            # plain `pacman -Syu` cannot synchronise a database there. The same
            # command on the x86_64 runner sandboxes itself and is left alone.
            # What that sandbox protects is a download running as root on a
            # machine that keeps its filesystem; this one is a container that
            # exists for one job and is thrown away with it.
            pacman-flags: "--disable-sandbox"
    steps:
      - name: Install toolchain
        env:
          PACMAN_FLAGS: ${{ matrix.pacman-flags }}
        # Unquoted, because an empty value has to disappear rather than become
        # an empty argument pacman would read as a package name.
        run:
          pacman -Syu --noconfirm $PACMAN_FLAGS git cmake ninja clang rust python qt6-base
          qt6-declarative qt6-webengine qt6-wayland hicolor-icon-theme xdg-utils libsecret libsodium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package takes its version from the nearest release tag, so the
          # tags have to be here for it to find the one being released.
          fetch-depth: 0
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every job here asks the same script what is being built, so a dry run
      # and a release cannot end up naming one thing two ways.
      - name: Name what is being built
        id: version
        run: |
          # Assigned before they are written, so that a script that failed ends
          # the step. `echo "$(...)"` would report the exit status of `echo` and
          # write an empty version, which fails later and somewhere else.
          version=$(scripts/release_version.sh)
          fragment=$(scripts/release_version.sh --source-fragment)
          {
            echo "version=$version"
            echo "fragment=$fragment"
          } >> "$GITHUB_OUTPUT"

      - name: Build the package
        # The binary package, `omaweb`, derived from the `omaweb-git` PKGBUILD
        # the repository keeps. The two cannot disagree about dependencies or
        # about how the browser is built, because one is written from the other.
        #
        # makepkg refuses to run as root, so the container's root builds as a
        # user it makes for the purpose. The source is this checkout at the tag
        # rather than a fresh clone, so the package is built from the commit the
        # release names.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_FRAGMENT: ${{ steps.version.outputs.fragment }}
          ARCH: ${{ matrix.arch }}
        run: |
          useradd --create-home builder
          mkdir -p artifacts
          scripts/make_release_pkgbuild.sh \
            --version "$VERSION" \
            --output /tmp/build \
            --source-url "omaweb::git+file://$GITHUB_WORKSPACE#$SOURCE_FRAGMENT"
          chown -R builder /tmp/build
          su builder -c 'cd /tmp/build && makepkg -f --noconfirm'
          # A container whose makepkg.conf enables `debug`, which Arch's own
          # base-devel does, produces a second package carrying the detached
          # symbols. That one is not what a reader installs, and attaching it
          # leaves the release offering two near-identically named files with
          # nothing to choose between them. `check_package.sh` skips it the
          # same way and says the same thing about why.
          find /tmp/build -maxdepth 1 -name '*.pkg.tar.*' ! -name '*-debug-*' \
            -exec cp {} artifacts/ \;
          # One package, or the release is wrong in a way nobody would notice
          # until they downloaded the wrong half of it.
          count=$(find artifacts -maxdepth 1 -name '*.pkg.tar.*' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one package to attach, found $count" >&2
            find artifacts -maxdepth 1 -name '*.pkg.tar.*' >&2
            exit 1
          fi
          # The runner decides the architecture and the matrix only names it, so
          # the two are held to each other here. A package whose name disagreed
          # with this leg would be filed under a directory of the repository no
          # client asking for that architecture reads.
          built=$(find artifacts -maxdepth 1 -name '*.pkg.tar.*' -exec basename {} \;)
          case "$built" in
            *-"$ARCH".pkg.tar.*) ;;
            *)
              echo "::error::$ARCH was asked for and $built was built" >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  # One inventory for the release rather than one per package. What it records —
  # the Rust dependency graph, the vendored assets, the approved engine — is
  # written down in this repository and is the same whichever machine built the
  # package, so a second copy could only invite the question of how the two
  # differ.
  inventory:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install toolchain
        # `cargo metadata` reads the licence of every crate the content blocker
        # links, which is most of what an inventory is for.
        run: pacman -Syu --noconfirm git rust python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate the inventory
        run: |
          version=$(scripts/release_version.sh)
          mkdir -p artifacts
          scripts/generate_sbom.py --output "artifacts/omaweb-$version-sbom.json" \
            --version "${version#v}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inventory
          path: artifacts/
          if-no-files-found: error

  release:
    needs: [package, inventory]
    # A dry run stops with the packages attached to the run. Everything below
    # publishes, and there is nothing to publish without a tag.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The notes rewrite retries an API that does not answer, so the budget
    # leaves the publish step time even when every attempt runs to its timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes are generated from the range since the previous tag, so the
          # whole history and every tag has to be present.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main" >&2
            exit 1
          fi

      - name: Generate notes
        run: |
          scripts/release_notes.sh "${GITHUB_REF_NAME}" > notes.md
          {
            echo "## Generated from the commits"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The commit list above is accurate and written for the people who wrote
      # the commits. This rewrites it as what a reader gets from upgrading,
      # from the same range's commit bodies and the issues behind them.
      #
      # `ANTHROPIC_API_KEY` is the one piece of setup a human does once. A tag
      # push publishes with nothing in between, so every way this can fail ends
      # the same way: the generated notes publish and the job summary says the
      # rewrite did not happen. A plainer release beats a blocked one.
      - name: Rewrite the notes for a reader
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The rewrite reads the issues the commits reference, which is what
          # keeps it describing what was asked for rather than what a subject
          # line happens to say.
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/rewrite_release_notes.py "${GITHUB_REF_NAME}" \
              --generated notes.md --output rewritten.md; then
            mv rewritten.md notes.md
            heading="## Published"
          else
            echo "::warning::the notes were not rewritten, publishing the generated list"
            heading="## Published, unrewritten"
          fi
          {
            echo
            echo "$heading"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Every package and the inventory, into one directory, because that
      # directory is what the release carries.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything below 1.0.0 is pre-release, as ADR 0028 records.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            v0.*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease} \
            artifacts/*

      # The website reads the releases at build time, so a tag only reaches the
      # page on the next deploy. Nothing else deploys on a tag: Vercel builds on
      # pushes to branches, and this ref is a tag. Without this, a release is
      # published and the site keeps showing the one before it until someone
      # happens to push a commit.
      #
      # `VERCEL_DEPLOY_HOOK_URL` is a Deploy Hook created once in the Vercel
      # project's Git settings. It is a URL that stands in for a credential, so
      # it is a secret. Until one exists the step says so and the release still
      # publishes: the site is behind, which is the same place it is today.
      - name: Deploy the website
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL secret: the website keeps the previous release" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The release is already published by the step above, so a deploy
          # that does not answer is a stale page rather than a failed release.
          # It warns and the job stays green, which is why the curl exit code
          # is captured instead of ending the step.
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --request POST "$HOOK") || status="no answer"
          echo "Vercel deploy hook answered ${status}" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            2*) ;;
            *) echo "::warning::the website deploy hook answered ${status}, so the site is behind" ;;
          esac

  # The upgrade path. The release above is what a reader downloads once; this is
  # what reaches the machines of everyone who already has Omaweb, through their
  # ordinary `pacman -Syu`.
  #
  # It runs after the release rather than beside it, because a repository
  # serving a version whose release failed to publish would be offering an
  # upgrade to a thing that does not exist.
  publish-repo:
    needs: [package, release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm git gnupg

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages alone: the inventory belongs to the release, and a
      # pacman repository is a directory of packages and a database.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-package-*
          merge-multiple: true
          path: artifacts

      # `PACMAN_SIGNING_KEY` is the armored private half of the repository's
      # signing subkey, and `PACMAN_SIGNING_KEY_PASSPHRASE` unlocks it when it
      # has one. Until the key exists this step says so and the job ends
      # green: the release is already published and a reader can still install
      # it by hand, which is where they are today.
      - name: Take up the signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.PACMAN_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.PACMAN_SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No PACMAN_SIGNING_KEY secret: the repository keeps the previous release" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME=/tmp/gnupg
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # A workflow has no terminal to ask on, so the passphrase is handed to
          # gpg rather than prompted for. It is written where only this job's
          # keyring can read it and leaves with the container.
          if [ -n "$PASSPHRASE" ]; then
            printf '%s' "$PASSPHRASE" > "$GNUPGHOME/passphrase"
            chmod 600 "$GNUPGHOME/passphrase"
            # `batch` because gpg documents `passphrase-file` as read only in
            # batch mode, and `repo-add` signs the database with a plain
            # `gpg --detach-sign` that passes neither it nor a passphrase.
            # gpg 2.4 in fact reads the file either way, so this is a hedge
            # against a container whose gpg does what the documentation says
            # rather than a repair of something seen failing.
            {
              echo "batch"
              echo "pinentry-mode loopback"
              echo "passphrase-file $GNUPGHOME/passphrase"
            } > "$GNUPGHOME/gpg.conf"
            echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          fi
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          if [ -z "$fingerprint" ]; then
            echo "::error::PACMAN_SIGNING_KEY carried no secret key" >&2
            exit 1
          fi
          # Its own key, so that verifying what it just signed is not a warning.
          echo "$fingerprint:6:" | gpg --batch --import-ownertrust
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Each package in turn, into the repository for its own architecture.
      # `publish_repo.sh` reads that architecture out of the package's name, and
      # so does this, because it decides which release serves the package.
      - name: Publish the package to the repository
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Each package in turn. `publish_repo.sh` reads the architecture out
          # of the package's own name and files it under that directory, so the
          # loop says nothing about which architectures there are.
          #
          # That every architecture is here is the matrix's doing rather than
          # this loop's: a leg that failed fails `needs`, and the release this
          # job waits on never runs. What is checked here is the case the
          # matrix cannot rule out, a directory of packages with none in it.
          published=0
          for package in artifacts/*.pkg.tar.*; do
            [ -e "$package" ] || continue
            case "$package" in *.sig) continue ;; esac
            arch=$(basename "$package")
            arch=${arch##*-}
            arch=${arch%%.pkg.tar.*}
            scripts/fetch_repo.sh --tag "repo-$arch" --dir "/tmp/repo/$arch"
            scripts/publish_repo.sh --package "$package" --repo-dir /tmp/repo \
              --key "${{ steps.key.outputs.fingerprint }}"
            scripts/serve_repo.sh --tag "repo-$arch" --dir "/tmp/repo/$arch" \
              --title "Package repository ($arch)"
            published=$(( published + 1 ))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::no package reached the repository" >&2
            exit 1
          fi
          {
            echo
            echo "## Published to the pacman repository"
            echo
            echo "\`${GITHUB_REF_NAME}\` is served from the \`repo-*\` releases."
          } >> "$GITHUB_STEP_SUMMARY"
