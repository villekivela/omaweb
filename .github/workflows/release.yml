name: Release

# A release is cut by pushing a tag. The tag is the source of truth: CMake
# derives the version from it, so the tag and the binary cannot disagree.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# This publishes notes only. A distributed Linux build needs the full notice
# inventory described in THIRD_PARTY_NOTICES.md. macOS bundles are development
# artifacts and are not attached to releases.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes are generated from the range since the previous tag, so the
          # whole history and every tag has to be present.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main" >&2
            exit 1
          fi

      - name: Generate notes
        run: |
          scripts/release_notes.sh "${GITHUB_REF_NAME}" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything below 1.0.0 is pre-release, as ADR 0028 records.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            v0.*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease}
