<!doctype html>
<!--
  The page one release gets, filled in by build/render.mjs and written both to
  dist/releases/index.html (the newest) and to dist/releases/<tag>/index.html.
  It lives under build/ rather than beside the site because it is not a page:
  its {{placeholders}} are not markup and it is never deployed.

  Master and detail are both markup here, not a pane the script swaps. Every
  version is its own address, so a release can be linked to and read with the
  script blocked, and the list is the navigation rather than a control.

  {{root}} is the way back to the site root, which differs between the two
  places this is written to, so every path below is relative to it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="application-name" content="Omaweb" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06060c" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Omaweb" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <link rel="icon" href="{{root}}/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="{{root}}/styles.css" />
    <link rel="stylesheet" href="{{root}}/themes.css" />
  </head>

  <body data-theme="hackerman">
    <div class="t-wrap">
      <header class="t-top">
        <a href="{{root}}/">
          <img
            data-themed="{{root}}/assets/icons/wordmark-{theme}.svg"
            src="{{root}}/assets/icons/wordmark-hackerman.svg"
            width="160"
            height="20"
            alt="Omaweb"
          />
        </a>
        <nav class="t-nav" aria-label="Sections">
          <a href="{{root}}/features/">Features</a>
          <a href="{{root}}/docs/">Docs</a>
          <a href="{{root}}/releases/" aria-current="true">Releases</a>
          <a href="{{root}}/#install">Install</a>
        </nav>
      </header>

      <div class="t-detail">
        <nav class="t-detail__master" aria-label="Releases">
          <p class="t-detail__masthead">Versions</p>
          {{nav}}
          <a class="t-detail__all" href="https://github.com/villekivela/omaweb/releases"
            >All releases on GitHub</a
          >
        </nav>

        <main class="t-detail__pane">
          <p class="t-section__index">Release notes</p>
          <h1>{{tag}}</h1>
          <p class="t-release__marks">{{marks}}</p>
          <div class="t-prose">{{notes}}</div>
          <p class="t-detail__foot">{{github}}</p>
        </main>
      </div>

      <footer class="t-foot">
        <span>Omaweb &middot; alpha &middot; MPL 2.0</span>
        <a href="https://github.com/villekivela/omaweb">github.com/villekivela/omaweb</a>
      </footer>
    </div>
    <script src="{{root}}/script.js"></script>
  </body>
</html>
