<!--
  One release's page, filled in by build/releases.mjs. The tag, its date and state, the notes and
  the link out are website/build/render.mjs's placeholders, the renderer the live site uses, which
  decides what a release body may become; the version list, its count and its filter are
  releases.mjs's own, since the list here names every kind of release.
-->
<section class="log wrap">
  <nav class="log__versions" aria-label="Releases">
    <p class="log__head"><span class="kicker">Release log</span><span>{{count}}</span></p>
    <div class="log__kinds" role="group" aria-label="Show" hidden>{{kinds}}</div>
    <div class="hud__screen log__screen">{{versions}}</div>
    <a class="log__all" href="https://github.com/villekivela/omaweb/releases"
      >Every release on GitHub <span aria-hidden="true">→</span></a
    >
  </nav>

  <article class="log__release">
    <p class="kicker">Release notes</p>
    <h1 class="display display--md">{{tag}}</h1>
    <p class="log__marks">{{marks}}</p>
    <div class="log__notes">{{notes}}</div>
    <p class="log__out">{{github}}</p>
  </article>
</section>
