<!doctype html>
<!--
  The shell every page of the site is written into by build/site.mjs: the
  head, the header with its nav, the rain behind the hero, the footer and the
  script. A page under pages/ is only what goes between the header and the
  footer, plus the few things named at its top, so the chrome is one copy
  here rather than one per page.

  It lives under build/ rather than beside the site because it is not a page:
  its placeholders are not markup and it is never deployed. `root` is the
  way back to the site root, which differs by how deep the page is written,
  so every path below is relative to it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="application-name" content="Omaweb" />
    <meta name="robots" content="index, follow" />
    <!-- Omaweb draws a page that asks in the reader's own theme, and asks
         nothing of a page that does not. -->
    <meta name="omaweb-palette" content="follow" />
    <meta name="theme-color" content="#101019" />
    <meta property="og:type" content="{{type}}" />
    <meta property="og:site_name" content="Omaweb" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{summary}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{summary}}" />
    <link rel="icon" href="{{root}}/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="{{root}}/assets/fonts/Orbitron.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="{{root}}/styles.css" />
    <!-- Generated from each Omarchy theme's own colors.toml by
         scripts/build_website_themes.py, alongside the screenshots drawn in
         the same palettes. -->
    <link rel="stylesheet" href="{{root}}/themes.css" />
  </head>

  <body>
    <!-- The scene behind the header and the hero: the rain of cells the
         screenshots' wallpaper is drawn from, and on the landing page a
         horizon under it, all drawn live in the active palette. Decorative:
         it is hidden from assistive technology and the page is complete
         without it. -->
    <canvas class="t-scene" aria-hidden="true"></canvas>
    <!-- GitHub's own mark, defined once and referenced by every button that
         goes there. `currentColor`, so it takes the button's text colour and
         follows the theme with it. Used to link to GitHub, which is what
         GitHub's brand guidance permits it for. -->
    <svg width="0" height="0" aria-hidden="true" class="t-sprite">
      <symbol id="mark-github" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0016 8c0-4.42-3.58-8-8-8z"
        />
      </symbol>
    </svg>

    <div class="t-wrap">
      <header class="t-top">
        <a href="{{root}}/">
          <span class="t-top__led" aria-hidden="true"></span>
          <svg
            class="t-wordmark"
            viewBox="0 0 160 20"
            width="160"
            height="20"
            fill="currentColor"
            role="img"
            aria-label="Omaweb"
          >
            <g transform="translate(-20.528031,-97.174413)">
              <path
                transform="translate(1.3101755,0.8976725)"
                d="m 28.63857,97.088945 -9.187009,9.187005 9.187009,9.18763 h 3.69342 l 13.915739,-13.91637 4.72873,4.72874 -9.187009,9.18763 h 6.305601 l 9.18701,-9.18763 -9.187622,-9.187005 H 44.40102 l -13.91574,13.915735 -4.728742,-4.72873 9.18701,-9.187005 z"
              />
              <path
                d="m 75.336749,116.72525 q -3.463561,0 -5.510211,-1.88922 -2.046649,-1.91545 -2.046649,-5.45773 v -4.40817 q 0,-3.54228 2.046649,-5.43149 2.04665,-1.915455 5.510211,-1.915455 3.463561,0 5.510211,1.915455 2.04665,1.88921 2.04665,5.43149 v 4.40817 q 0,3.54228 -2.04665,5.45773 -2.04665,1.88922 -5.510211,1.88922 z m 0,-3.09621 q 1.941694,0 3.017497,-1.12829 1.075803,-1.12828 1.075803,-3.01749 v -4.61808 q 0,-1.88922 -1.075803,-3.0175 -1.075803,-1.12828 -3.017497,-1.12828 -1.915454,0 -3.017496,1.12828 -1.075803,1.12828 -1.075803,3.0175 v 4.61808 q 0,1.88921 1.075803,3.01749 1.102042,1.12829 3.017496,1.12829 z M 86.20194,116.3579 V 97.990533 h 6.428579 l 3.174932,16.005847 h 0.472303 l 3.174931,-16.005847 h 6.428575 V 116.3579 h -3.3586 v -15.82217 h -0.4723 l -3.148696,15.82217 h -5.720123 l -3.148692,-15.82217 h -0.472304 v 15.82217 z m 22.14799,0 4.82799,-18.367367 h 6.035 l 4.82799,18.367367 h -3.56852 l -0.99708,-4.04082 h -6.55978 l -0.99708,4.04082 z m 5.37901,-7.24199 h 4.93295 l -2.23032,-8.94753 h -0.4723 z m 13.77775,7.24199 -2.414,-18.367367 h 3.43732 l 1.78426,15.953377 h 0.4723 l 2.30904,-15.953377 h 5.98252 l 2.30904,15.953377 h 0.4723 l 1.78426,-15.953377 h 3.43732 l -2.41399,18.367367 h -5.98252 l -2.36152,-16.32072 h -0.4723 l -2.36152,16.32072 z m 22.35792,0 V 97.990533 h 11.80759 v 3.148687 h -8.34403 v 4.38193 h 7.60934 v 3.1487 h -7.60934 v 4.53936 h 8.50147 v 3.14869 z m 14.27628,0 v -3.04373 h 2.414 v -12.2799 h -2.414 v -3.043737 h 9.44608 q 1.6793,0 2.91254,0.57726 1.25947,0.551021 1.94169,1.600587 0.70845,1.02332 0.70845,2.46647 v 0.26239 q 0,1.25948 -0.4723,2.07289 -0.4723,0.78718 -1.12828,1.23324 -0.62974,0.41983 -1.207,0.6035 v 0.4723 q 0.57726,0.15744 1.25948,0.6035 0.68221,0.41983 1.15452,1.23324 0.49854,0.81341 0.49854,2.12537 v 0.26239 q 0,1.52187 -0.70845,2.62391 -0.70846,1.0758 -1.96794,1.65306 -1.23323,0.57726 -2.8863,0.57726 z m 5.87756,-3.14869 h 3.25365 q 1.12828,0 1.81049,-0.55102 0.70846,-0.55102 0.70846,-1.57435 v -0.26239 q 0,-1.02332 -0.68222,-1.57434 -0.68221,-0.55102 -1.83673,-0.55102 h -3.25365 z m 0,-7.66182 h 3.20117 q 1.0758,0 1.75802,-0.55102 0.70845,-0.55102 0.70845,-1.52187 v -0.26239 q 0,-0.99708 -0.68221,-1.52186 -0.68222,-0.55103 -1.78426,-0.55103 h -3.20117 z"
              />
            </g>
          </svg>
        </a>
        <!-- The landing page says what Omaweb is. The list of what is in it,
             the documentation and the releases are pages of their own,
             because each is a thing a reader comes back to rather than
             something to scroll past on the way to the install commands.
             The build writes the entries and marks the current one. -->
        <!-- The menu on a phone. Hidden until the script wires it, so a page
             without the script keeps its links in view. -->
        <button
          class="t-nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="sections"
          aria-label="Menu"
          hidden
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path class="t-nav-toggle__open" d="M4 7h16M4 12h16M4 17h16" />
            <path class="t-nav-toggle__close" d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <nav class="t-nav" id="sections" aria-label="Sections">
          {{nav}}
          <!-- The source, as GitHub's own mark: the one link that leaves the
               site, at the end of the row. The word is for the phone's menu,
               where a row of links is words. -->
          <a class="t-nav__github" href="https://github.com/villekivela/omaweb">
            <svg class="t-nav__mark" aria-hidden="true"><use href="#mark-github" /></svg>
            <span>GitHub</span>
          </a>
        </nav>
      </header>

      {{body}}

      <footer class="t-foot">
        <span>Omaweb &middot; alpha &middot; MPL 2.0</span>
        <span class="t-foot__eot" aria-hidden="true">&#9646; end of transmission</span>
        <a href="https://github.com/villekivela/omaweb">github.com/villekivela/omaweb</a>
      </footer>
    </div>
    <script src="{{root}}/script.js"></script>
  </body>
</html>
